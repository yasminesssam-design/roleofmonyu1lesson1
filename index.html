const S=[
["1. Why Money Developed","١. لماذا ظهرت النقود؟",[
["<b class=t>Barter</b>: Exchanging what people have with one another to get what they need has long been practiced in many regions.","<b>المقايضة</b>: تبادل ما يملكه الناس مع بعضهم للحصول على ما يحتاجونه، وقد مورست منذ زمن طويل في مناطق كثيرة."],
["<b class=t>Problems of barter</b><br>• It is difficult to compare the value of different goods.<br>• A <b>double coincidence of wants</b> is required (A must have what B wants, and B must have what A wants).<br>• Some goods cannot be stored for a long time.","<b>مشكلات المقايضة</b><br>• يصعب مقارنة قيمة السلع المختلفة.<br>• لا بد من <b>توافق الرغبات المزدوج</b> (يجب أن يملك (أ) ما يريده (ب)، ويملك (ب) ما يريده (أ)).<br>• بعض السلع لا يمكن تخزينها مدة طويلة."],
["In many societies, various forms of <b class=t>Money</b> developed as a widely accepted means of payment to make exchange easier.","في مجتمعات كثيرة ظهرت أشكال مختلفة من <b>النقود</b> كوسيلة دفع مقبولة على نطاق واسع لتسهيل التبادل."],
["The things used as money have changed over time:<div class=flow><div>🐚<small>Shells and Stones<br>الأصداف والأحجار</small></div>➜<div>🪙<small>Metal Coins<br>عملات معدنية</small></div>➜<div>💵<small>Banknotes<br>أوراق نقدية</small></div>➜<div>📱<small>Electronic Money<br>نقود إلكترونية</small></div></div>The means of exchange did not develop in the same way or in the same order in every society. Today, some form of money is widely used as a medium of exchange in most parts of the world.","تغيّر ما يُستخدم كنقود عبر الزمن: الأصداف والأحجار ← العملات المعدنية ← الأوراق النقدية ← النقود الإلكترونية. ولم تتطور وسائل التبادل بالطريقة نفسها أو بالترتيب نفسه في كل مجتمع. أما اليوم فيُستخدم شكل من أشكال النقود على نطاق واسع كوسيط للتبادل في معظم أنحاء العالم."],
["Banknotes are one important form of money today. But why are banknotes, which are merely pieces of paper, accepted as having value?<br>• <b class=t>Convertible Banknotes</b>: guaranteed to be exchangeable for a certain amount of gold or silver.<br>• <b class=t>Fiat Money</b>: not guaranteed to be exchangeable for gold or silver.","الأوراق النقدية شكل مهم من النقود اليوم. لكن لماذا تُقبل الأوراق النقدية، وهي مجرد قطع ورق، على أن لها قيمة؟<br>• <b>الأوراق النقدية القابلة للتحويل</b>: مضمون تبديلها بكمية معينة من الذهب أو الفضة.<br>• <b>النقود الإلزامية (Fiat)</b>: غير مضمون تبديلها بالذهب أو الفضة."],
["<b class=t>Trust</b>: Almost all modern banknotes are fiat money. Even so, they are regarded as “things that have value” and “things that can be used to buy goods” because people trust the government and the central bank that issue them.","<b>الثقة</b>: معظم الأوراق النقدية الحديثة نقود إلزامية. ومع ذلك تُعتبر «أشياء لها قيمة» و«أشياء يمكن شراء السلع بها» لأن الناس يثقون في الحكومة والبنك المركزي اللذين يصدرانها."],
["<b class=t>Hyperinflation</b>: a situation in which the value of money falls rapidly and the prices of goods rise sharply.<br>• Trust in the government or authority that issues the currency declines.<br>• Many people stop believing banknotes will keep the same value in the future.<br>• Sellers stop accepting the previous prices, and prices rise.<br>So it is important to maintain systems that protect the trust supporting the value of banknotes.","<b>التضخم الجامح</b>: حالة تنخفض فيها قيمة النقود بسرعة وترتفع أسعار السلع بشدة.<br>• تقل الثقة في الحكومة أو الجهة التي تصدر العملة.<br>• يتوقف كثيرون عن الاعتقاد بأن الأوراق النقدية ستحتفظ بقيمتها مستقبلًا.<br>• يتوقف البائعون عن قبول الأسعار السابقة فترتفع الأسعار.<br>لذلك من المهم الحفاظ على أنظمة تحمي الثقة التي تدعم قيمة الأوراق النقدية."]]],
["2. The Three Functions of Money","٢. الوظائف الثلاث للنقود",[
["<b class=t>(i) Unit of Account</b>: By using money as a common unit, people can express and compare prices. If 10 kg of rice costs 250 EGP and a soccer ball costs 120 EGP, you can quickly tell the rice is more expensive.","<b>(١) وحدة حساب</b>: باستخدام النقود كوحدة مشتركة يستطيع الناس التعبير عن أسعار الأشياء ومقارنتها. إذا كان ١٠ كجم أرز بـ ٢٥٠ جنيهًا وكرة قدم بـ ١٢٠ جنيهًا، فتعرف بسرعة أن الأرز أغلى."],
["<b class=t>(ii) Medium of Exchange</b>: Money can be used to pay for goods and services, making exchange smoother. Paying in cash and having a payment deducted from a bank account are both examples.","<b>(٢) وسيط للتبادل</b>: يمكن استخدام النقود لدفع ثمن السلع والخدمات مما يجعل التبادل أسهل. الدفع نقدًا وخصم مبلغ من الحساب البنكي مثالان على ذلك."],
["<b class=t>(iii) Store of Value</b>: Unlike food that spoils or things that break easily, money can preserve its value for a relatively long time. But this is not perfect: if something that cost 100 EGP 20 years ago now costs 120 EGP, the value of 100 EGP has decreased. → <b class=t>Inflation</b>","<b>(٣) مخزن للقيمة</b>: على عكس الطعام الذي يفسد أو الأشياء التي تنكسر بسهولة، تحافظ النقود على قيمتها لفترة طويلة نسبيًا. لكن هذه الوظيفة ليست مثالية: فإذا كان شيء ثمنه ١٠٠ جنيه قبل ٢٠ عامًا وثمنه الآن ١٢٠ جنيهًا، فهذا يعني أن قيمة الـ ١٠٠ جنيه انخفضت. ← <b>التضخم</b>"]]],
["3. Money and Payment Methods Today","٣. النقود وطرق الدفع اليوم",[
["<b class=t>(a) Electronic Money</b>: a system in which monetary value, based on funds paid in advance by the user, is recorded electronically and used for payment. It can be accessed through a card or mobile wallet.","<b>(أ) النقود الإلكترونية</b>: نظام تُسجَّل فيه القيمة النقدية، المبنية على أموال دفعها المستخدم مسبقًا، إلكترونيًا وتُستخدم في الدفع. ويمكن الوصول إليها عبر بطاقة أو محفظة هاتف."],
["<b class=t>Digital payments</b> are made through electronic records or communications without directly exchanging cash. The place where funds are held and the timing of payment differ by method.<br>• <b>Bank Account</b>: a bank manages funds as deposits; the amount is deducted from the available balance when used.<br>• <b>Payment Card</b>: a tool to access funds or a credit line and make payments.<br>• <b>Mobile Wallet</b>: a service to pay through electronic money, bank accounts, cards, etc. using a smartphone. Limits, fees and security rules differ by service.","<b>المدفوعات الرقمية</b> تتم عبر سجلات أو اتصالات إلكترونية دون تبادل النقود مباشرة. ويختلف مكان حفظ الأموال وتوقيت الدفع حسب الطريقة.<br>• <b>الحساب البنكي</b>: يدير البنك الأموال كودائع، ويُخصم المبلغ من الرصيد المتاح عند الدفع.<br>• <b>بطاقة الدفع</b>: أداة للوصول إلى الأموال أو خط ائتمان وإجراء المدفوعات.<br>• <b>المحفظة الإلكترونية</b>: خدمة للدفع باستخدام النقود الإلكترونية أو الحسابات البنكية أو البطاقات عبر الهاتف الذكي. وتختلف الحدود والرسوم وقواعد الأمان حسب الخدمة."],
["<b class=t>(b) Central Bank</b>: a special bank that issues banknotes and adjusts the amount of money circulating in the economy to stabilize the flow of money. In Egypt, this role is played by the <b>Central Bank of Egypt (CBE)</b>.<br><b class=t>Legal Tender</b>: a currency issued by a government or central bank and officially recognized by law as a means of settling debts.<br>Cash carries the risk of loss or theft, and inflation may reduce what the same amount of money can buy.","<b>(ب) البنك المركزي</b>: بنك خاص يصدر الأوراق النقدية وينظّم كمية النقود المتداولة في الاقتصاد لتحقيق استقرار تدفق النقود. وفي مصر يقوم بهذا الدور <b>البنك المركزي المصري (CBE)</b>.<br><b>العملة القانونية</b>: عملة تصدرها الحكومة أو البنك المركزي ويعترف بها القانون رسميًا كوسيلة لتسوية الديون.<br>النقد يعرّض لخطر الضياع أو السرقة، وقد يقلل التضخم ما يمكن شراؤه بنفس المبلغ."],
["<b class=t>(c) CBDC</b> (Central Bank Digital Currency): a digital form of money issued by a central bank, denominated in the country’s currency. Its legal status, uses, risk controls and user protection depend on the central bank’s design and the country’s legal framework. It exists only as digital data, not coins or banknotes.","<b>(ج) العملة الرقمية للبنك المركزي (CBDC)</b>: شكل رقمي من النقود يصدره البنك المركزي بعملة الدولة. ويعتمد وضعها القانوني واستخداماتها وضوابط المخاطر وحماية المستخدم على تصميم البنك المركزي والإطار القانوني للدولة. وهي موجودة كبيانات رقمية فقط وليست عملات معدنية أو ورقية."],
["<b class=t>Crypto-assets</b>: digital assets generally not issued by public authorities such as central banks or governments. A digital asset exists as electronic data and can be held and traded online (e.g., Bitcoin and Ethereum). They are <b>not equivalent to legal tender</b>; their prices can fluctuate greatly with supply and demand and users’ expectations. Risks include fraud, loss of access and limited user protection.","<b>الأصول المشفرة</b>: أصول رقمية لا تصدرها عادةً جهات عامة مثل البنوك المركزية أو الحكومات. الأصل الرقمي يوجد كبيانات إلكترونية ويمكن حيازته وتداوله عبر الإنترنت (مثل بيتكوين وإيثريوم). وهي <b>ليست مساوية للعملة القانونية</b>؛ إذ تتقلب أسعارها بشدة بسبب العرض والطلب وتوقعات المستخدمين. ومخاطرها: الاحتيال وفقدان الوصول وضعف حماية المستخدم."],
["<b class=t>(d) Financial Inclusion</b>: the idea that everyone should have access to financial services such as bank accounts and money transfers. Some electronic money services and mobile wallets that do not require a bank account make financial services easier for people who have difficulty opening an account. CBDCs may also help, depending on their design and conditions of use.","<b>(د) الشمول المالي</b>: فكرة أن يتمكن الجميع من الوصول إلى الخدمات المالية مثل الحسابات البنكية وتحويل الأموال. بعض خدمات النقود الإلكترونية والمحافظ التي لا تتطلب حسابًا بنكيًا تسهّل الخدمات المالية على من يصعب عليهم فتح حساب. وقد تساعد العملات الرقمية للبنوك المركزية أيضًا حسب تصميمها وظروف استخدامها."]]]];

function show(x){$('L').classList.toggle('hide',x!='L');$('Q').classList.toggle('hide',x!='Q');scrollTo(0,0)}
let ac,score=0,done=0;
function beep(ok){try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.type=ok?'sine':'sawtooth';o.frequency.value=ok?660:180;if(ok)o.frequency.setValueAtTime(880,ac.currentTime+.12);g.gain.value=.15;o.start();o.stop(ac.currentTime+.25)}catch(e){}}
function build(){score=0;done=0;$('res').innerHTML='';$('bar').firstChild.style.width=0;
$('qs').innerHTML=Q.map((q,i)=>{const t=q[0]=='t',en=t?TF.map(x=>x[0]):q[3],ar=t?TF.map(x=>x[1]):q[4],a=t?q[3]:q[5],qe=q[1],qa=q[2];
return `<div class=q id=q${i}><b>${i+1}. ${qe}</b><div class=ar>${qa}</div>`+en.map((e,j)=>`<button class=o onclick="pick(${i},${j},${a})">${t?'':'ABCD'[j]+') '}${e}<span>${ar[j]}</span></button>`).join('')+`<div class=fb></div></div>`}).join('')}
function pick(i,j,a){const b=document.querySelectorAll('#q'+i+' .o');if(b[0].disabled)return;b.forEach(x=>x.disabled=true);b[a].classList.add('ok');const ok=j==a;if(!ok)b[j].classList.add('no');
const f=document.querySelector('#q'+i+' .fb');f.innerHTML=ok?'🎉 Correct! / إجابة صحيحة':'😢 Wrong / إجابة خاطئة — الصحيحة: '+'ABCD'[a];f.style.color=ok?'var(--ok)':'var(--no)';
document.getElementById('q'+i).classList.add('pop');beep(ok);if(ok)score++;done++;$('bar').firstChild.style.width=done*5+'%';
if(done==Q.length){const m=score>=18?'🏆 Excellent! / ممتاز':score>=14?'👏 Very good! / جيد جدًا':score>=10?'🙂 Good / جيد':'📚 Review the lesson / راجع الدرس';
$('res').innerHTML=`<p>${m}<br>Score / الدرجة: <b>${score} / ${Q.length}</b></p><button onclick="build();scrollTo(0,0)">🔁 Try again / أعد المحاولة</button>`;$('res').scrollIntoView({behavior:'smooth'})}}
